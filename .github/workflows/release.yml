name: Build and release

on:
  push:
    branches:
      - master
    paths:
      - pom.xml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Read project version
        id: version
        run: echo "value=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Build jar and run tests
        run: mvn --batch-mode --no-transfer-progress package

      - name: Check whether this version has a release
        id: release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v${VERSION}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "${TAG}" "target/ThaumcraftVisRelayFix-${VERSION}.jar" \
            --title "Thaumcraft Vis Relay Fix ${VERSION}" \
            --generate-notes
